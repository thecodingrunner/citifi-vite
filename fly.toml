# fly.toml app configuration file generated for citifi-vite on 2025-12-08T20:27:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'citifi-vite'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
